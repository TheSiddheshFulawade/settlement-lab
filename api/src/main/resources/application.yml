# Let in-flight requests finish before the engine is closed (REQ-API-006).
server:
  shutdown: graceful
  # Pinned: on a detected cloud platform Boot would otherwise let Tomcat consume X-Forwarded-For, and a forged
  # first entry would then become "the visitor" (REQ-RUN-006). Leave server.tomcat.remoteip.* unset too.
  forward-headers-strategy: none
  tomcat:
    connection-timeout: 5s # per read: a stalled body is answered after 5 s and closed after about 10 s, not 60
    keep-alive-timeout: 60s # explicit, or it would fall to 5 s as well
spring:
  servlet:
    multipart:
      enabled: false # parsed on any method, into temporary files, past the 16 KB cap; nothing here takes uploads
  mvc:
    problemdetails:
      enabled: true # RFC 9457 bodies for malformed or invalid requests (REQ-API-003)
    formcontent:
      filter:
        enabled: false # that filter reads a PUT/PATCH/DELETE form body into memory; nothing here takes forms (REQ-API-009)
  web:
    resources:
      add-mappings: false # no static files: an unknown path (any method) is a 404, never a 405 from the file handler
  jackson:
    deserialization:
      fail-on-unknown-properties: true # an unknown field is a 400 (REQ-API-009)
    mapper:
      allow-coercion-of-scalars: false # "5" is not a number and 5 is not a string (REQ-API-009)
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
# An unknown path must not write a WARN that holds the visitor's text.
logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR
# Only health is public, with no details (REQ-RUN-013). Anything else is not exposed, so it answers 404.
management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
# Engine settings (all optional; defaults in SettlementProperties).
settlement:
  ledger: LOCKING
  threads: VIRTUAL
  faults: NONE
# Runs API (all optional; defaults in RunsProperties, which are the contract's numbers).
#   settlement.runs.preview-origin: https://develop.portfolio-7qt.pages.dev
#   settlement.runs.trusted-proxy-ranges: only behind a proxy you run and trust (none is set: not deployed, V2-06 dropped)
