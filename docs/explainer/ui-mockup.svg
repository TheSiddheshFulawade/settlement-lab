<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d">
  <title id="t">Lab page design (parked; the API is not hosted)</title>
  <desc id="d">Mockup of the parked Lab page design: settings on the left (ledger, threads, faults, size, Run), live numbers and a throughput chart on the right, and the invariant checks at the bottom.</desc>
  <style>
    .bg{fill:#0b1220}.chrome{fill:#1a2436}.card{fill:#121c2e;stroke:#2a3a55;stroke-width:1.2}
    .h{font:600 14px "Segoe UI",-apple-system,Helvetica,Arial,sans-serif;fill:#e6edf6}
    .s{font:12px "Segoe UI",-apple-system,Helvetica,Arial,sans-serif;fill:#93a4bd}
    .n{font:700 22px ui-monospace,Consolas,monospace;fill:#e6edf6}
    .k{font:600 12px ui-monospace,Consolas,monospace}
    .on{fill:#2dd4bf}.off{fill:#1b2a42;stroke:#2a3a55}.ok{fill:#4ade80}.warn{fill:#f59e0b}
    .dark{fill:#0b1220}
  </style>
  <rect class="bg" width="940" height="470" rx="14"/>
  <rect class="chrome" x="0" y="0" width="940" height="36" rx="14"/><rect class="chrome" x="0" y="20" width="940" height="16"/>
  <circle cx="22" cy="18" r="5" fill="#f87171"/><circle cx="40" cy="18" r="5" fill="#f59e0b"/><circle cx="58" cy="18" r="5" fill="#4ade80"/>
  <rect x="90" y="8" width="420" height="20" rx="10" fill="#0b1220"/><text class="s" x="104" y="22">siddheshfulawade.com/lab</text>

  <!-- controls -->
  <rect class="card" x="20" y="52" width="250" height="400" rx="10"/>
  <text class="h" x="36" y="78">Run an experiment</text>
  <text class="s" x="36" y="104">Ledger</text>
  <rect class="on" x="36" y="112" width="104" height="28" rx="6"/><text class="k dark" x="88" y="131" text-anchor="middle">LOCKING</text>
  <rect class="off" x="148" y="112" width="104" height="28" rx="6"/><text class="k" fill="#c3cfdf" x="200" y="131" text-anchor="middle">CAS</text>
  <text class="s" x="36" y="164">Threads</text>
  <rect class="off" x="36" y="172" width="104" height="28" rx="6"/><text class="k" fill="#c3cfdf" x="88" y="191" text-anchor="middle">PLATFORM</text>
  <rect class="on" x="148" y="172" width="104" height="28" rx="6"/><text class="k dark" x="200" y="191" text-anchor="middle">VIRTUAL</text>
  <text class="s" x="36" y="224">Faults in the general ledger</text>
  <rect class="off" x="36" y="232" width="68" height="28" rx="6"/><text class="k" fill="#c3cfdf" x="70" y="251" text-anchor="middle">NONE</text>
  <rect class="on" x="110" y="232" width="68" height="28" rx="6"/><text class="k dark" x="144" y="251" text-anchor="middle">FLAKY</text>
  <rect class="off" x="184" y="232" width="68" height="28" rx="6"/><text class="k" fill="#c3cfdf" x="218" y="251" text-anchor="middle">OUTAGE</text>
  <text class="s" x="36" y="284">Transfers: 20,000 · duplicates: 2 %</text>
  <rect x="36" y="294" width="216" height="6" rx="3" fill="#1b2a42"/><rect x="36" y="294" width="120" height="6" rx="3" class="on"/>
  <rect x="36" y="324" width="216" height="40" rx="8" class="on"/><text class="h dark" x="144" y="349" text-anchor="middle" style="fill:#0b1220">▶ Run</text>
  <text class="s" x="36" y="392">Limits: 5 runs per hour,</text>
  <text class="s" x="36" y="408">20 s max, 2 runs at once.</text>
  <text class="s" x="36" y="434">Code: github.com/…/settlement-lab</text>

  <!-- tiles -->
  <rect class="card" x="290" y="52" width="150" height="76" rx="10"/><text class="s" x="304" y="74">Transfers / s</text><text class="n" x="304" y="110">225,608</text>
  <rect class="card" x="452" y="52" width="150" height="76" rx="10"/><text class="s" x="466" y="74">p99 latency</text><text class="n" x="466" y="110">735 µs</text>
  <rect class="card" x="614" y="52" width="150" height="76" rx="10"/><text class="s" x="628" y="74">Queue depth</text><text class="n" x="628" y="110">12 / 1,024</text>
  <rect class="card" x="776" y="52" width="144" height="76" rx="10"/><text class="s" x="790" y="74">GL breaker</text>
  <rect x="790" y="86" width="84" height="26" rx="13" class="ok"/><text class="k dark" x="832" y="104" text-anchor="middle">CLOSED</text>

  <!-- chart -->
  <rect class="card" x="290" y="140" width="630" height="186" rx="10"/>
  <text class="h" x="306" y="164">Live: throughput and retries (updates 4× a second)</text>
  <polyline fill="none" stroke="#2dd4bf" stroke-width="2.5" points="306,300 340,250 380,232 420,236 460,226 500,240 540,230 580,228 620,236 660,222 700,230 740,226 780,232 820,224 860,228 900,226"/>
  <polyline fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" points="306,312 340,300 380,292 420,306 460,296 500,288 540,302 580,298 620,290 660,304 700,296 740,300 780,292 820,302 860,296 900,298"/>
  <text class="k on" x="306" y="186">— transfers/s</text><text class="k warn" x="430" y="186">- - GL retries/s</text>

  <!-- invariants -->
  <rect x="290" y="338" width="630" height="114" rx="10" fill="#0f2a24" stroke="#1f5c4f"/>
  <text class="h" x="306" y="362">Invariant checks after the run</text>
  <text class="k ok" x="306" y="388">✓ total money unchanged: 1,000,000,000 → 1,000,000,000</text>
  <text class="k ok" x="306" y="408">✓ 400 duplicates sent, 0 applied twice</text>
  <text class="k ok" x="306" y="428">✓ no balance below zero · ✓ general ledger matches the ledger</text>
</svg>
